<svg xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 900 65"
    width="100%" height="100%">

  <defs>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078D4" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <!-- Path 0: DevOps & Cloud Platform Engineer -->
    <path id="path0">
      <animate id="d0" attributeName="d" begin="0s;d4.end"
        dur="3500ms" fill="remove"
        values="m275,38 h0 ; m275,38 h600 ; m275,38 h600 ; m275,38 h0"
        keyTimes="0;0.5;0.85;1" />
    </path>

    <!-- Path 1: Azure Landing Zones & Hub-Spoke -->
    <path id="path1">
      <animate id="d1" attributeName="d" begin="d0.end"
        dur="3500ms" fill="remove"
        values="m275,38 h0 ; m275,38 h600 ; m275,38 h600 ; m275,38 h0"
        keyTimes="0;0.5;0.85;1" />
    </path>

    <!-- Path 2: Modular Terraform IaC -->
    <path id="path2">
      <animate id="d2" attributeName="d" begin="d1.end"
        dur="3500ms" fill="remove"
        values="m275,38 h0 ; m275,38 h600 ; m275,38 h600 ; m275,38 h0"
        keyTimes="0;0.5;0.85;1" />
    </path>

    <!-- Path 3: Azure DevOps Pipelines & Agents -->
    <path id="path3">
      <animate id="d3" attributeName="d" begin="d2.end"
        dur="3500ms" fill="remove"
        values="m275,38 h0 ; m275,38 h600 ; m275,38 h600 ; m275,38 h0"
        keyTimes="0;0.5;0.85;1" />
    </path>

    <!-- Path 4: Kubernetes, GitOps & MLOps -->
    <path id="path4">
      <animate id="d4" attributeName="d" begin="d3.end"
        dur="3500ms" fill="remove"
        values="m275,38 h0 ; m275,38 h600 ; m275,38 h600 ; m275,38 h0"
        keyTimes="0;0.5;0.85;1" />
    </path>
  </defs>

  <!-- Terminal Container Background -->
  <rect width="900" height="65" rx="10" fill="#0b0f19" stroke="url(#termBorder)" stroke-width="1.5" />

  <!-- Terminal Window Control Buttons -->
  <circle cx="25" cy="33" r="5.5" fill="#ff5f56" />
  <circle cx="42" cy="33" r="5.5" fill="#ffbd2e" />
  <circle cx="59" cy="33" r="5.5" fill="#27c93f" />

  <!-- Terminal Prompt -->
  <text x="82" y="38" fill="#34D399" font-family="'Fira Code', 'Courier New', Courier, monospace" font-size="14.5" font-weight="700">anjali@azure-devops:~$ </text>

  <!-- Title 0 -->
  <text font-family="'Fira Code', 'Courier New', Courier, monospace" fill="#38BDF8" font-size="14.5" font-weight="600">
    <textPath xlink:href="#path0">
      DevOps &amp; Cloud Platform Engineer ☁️
    </textPath>
  </text>

  <!-- Title 1 -->
  <text font-family="'Fira Code', 'Courier New', Courier, monospace" fill="#00D2FF" font-size="14.5" font-weight="600">
    <textPath xlink:href="#path1">
      Azure Landing Zones &amp; Hub-Spoke Topology 🏗️
    </textPath>
  </text>

  <!-- Title 2 -->
  <text font-family="'Fira Code', 'Courier New', Courier, monospace" fill="#C084FC" font-size="14.5" font-weight="600">
    <textPath xlink:href="#path2">
      Modular Terraform IaC &amp; Remote State Locks 🧱
    </textPath>
  </text>

  <!-- Title 3 -->
  <text font-family="'Fira Code', 'Courier New', Courier, monospace" fill="#60A5FA" font-size="14.5" font-weight="600">
    <textPath xlink:href="#path3">
      Azure DevOps Multi-Stage Pipelines &amp; Agents ⚡
    </textPath>
  </text>

  <!-- Title 4 -->
  <text font-family="'Fira Code', 'Courier New', Courier, monospace" fill="#34D399" font-size="14.5" font-weight="600">
    <textPath xlink:href="#path4">
      Kubernetes (AKS), GitOps &amp; MLOps Pipelines 🤖
    </textPath>
  </text>

</svg>
