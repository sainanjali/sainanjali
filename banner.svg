<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2F1FF" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.15" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="40" y2="0" stroke="#0078D4" stroke-opacity="0.08" stroke-width="1" />
      <line x1="0" y1="0" x2="0" y2="40" stroke="#0078D4" stroke-opacity="0.08" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .mono-text {
      font-family: 'SFMono-Regular', Consolas, 'Fira Code', Menlo, monospace;
    }
    .sans-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="20" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs with Native SMIL Pulsing Animation -->
  <circle cx="150" cy="80" r="140" fill="#0078D4" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;0.35;0.15" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="240" r="180" fill="#7928CA" filter="url(#glow)">
    <animate attributeName="opacity" values="0.12;0.32;0.12" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="160" r="100" fill="#00D2FF" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- Border Frame -->
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Animated Tech Waves / Lines with SMIL Morph -->
  <path fill="none" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.25">
    <animate attributeName="d" 
      values="M0,280 C300,260 450,300 700,270 C950,240 1100,290 1200,275;
              M0,275 C250,290 500,260 750,285 C950,265 1100,270 1200,280;
              M0,280 C300,260 450,300 700,270 C950,240 1100,290 1200,275" 
      dur="7s" repeatCount="indefinite" />
  </path>
  <path fill="none" stroke="#7928CA" stroke-width="2" stroke-opacity="0.25">
    <animate attributeName="d" 
      values="M0,295 C250,275 500,310 800,285 C1000,265 1150,305 1200,295;
              M0,290 C300,305 550,275 800,295 C1050,280 1150,290 1200,290;
              M0,295 C250,275 500,310 800,285 C1000,265 1150,305 1200,295" 
      dur="9s" repeatCount="indefinite" />
  </path>

  <!-- LEFT: Tech Emblem / Azure Cloud Icon with Rotating Ring -->
  <g transform="translate(70, 75)">
    <!-- Rotating Outer Dashed Ring (SMIL Animation) -->
    <circle cx="75" cy="75" r="72" fill="#0078D4" fill-opacity="0.08" stroke="#00D2FF" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="8,6">
      <animateTransform attributeName="transform" type="rotate" from="0 75 75" to="360 75 75" dur="15s" repeatCount="indefinite" />
    </circle>
    
    <!-- Inner Circle -->
    <circle cx="75" cy="75" r="58" fill="#0a1530" stroke="#0078D4" stroke-width="2" />
    
    <!-- Cloud & Gear SVG Icon -->
    <path d="M52,85 C45,85 39,79 39,72 C39,66 43,61 49,60 C50,51 58,45 68,45 C77,45 84,50 87,57 C90,55 93,54 96,54 C104,54 110,60 110,68 C110,69 110,70 109,71 C113,73 116,78 116,83 C116,90 110,95 103,95 L52,95 Z" fill="url(#neonCyan)" filter="url(#softGlow)" />
    <!-- Center Tech Node with Pulse -->
    <circle cx="75" cy="75" r="7" fill="#FFFFFF" />
    <circle cx="75" cy="75" r="14" fill="none" stroke="#00D2FF" stroke-width="2">
      <animate attributeName="r" values="12;18;12" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- CENTER-RIGHT CONTENT -->
  <!-- Top Kicker Pill -->
  <g transform="translate(250, 48)">
    <rect x="0" y="0" width="380" height="28" rx="14" fill="url(#pillGrad)" stroke="#00D2FF" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="14" r="5" fill="#00D2FF" filter="url(#softGlow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" fill="#00D2FF" font-size="12" font-weight="700" class="mono-text">✦ CLOUD &amp; DEVOPS PLATFORM ENGINEER</text>
  </g>

  <!-- Main Name Title -->
  <text x="250" y="132" fill="url(#textGrad)" font-size="54" class="title-text" filter="url(#softGlow)">ANJALI SAIN</text>

  <!-- Subtitle with Specialties -->
  <g transform="translate(250, 168)">
    <text x="0" y="0" fill="#94A3B8" font-size="17" font-weight="500" class="sans-text">
      <tspan fill="#38BDF8" font-weight="700">Azure Cloud</tspan> • 
      <tspan fill="#A855F7" font-weight="700">Modular Terraform</tspan> • 
      <tspan fill="#38BDF8" font-weight="700">Kubernetes (AKS)</tspan> • 
      <tspan fill="#34D399" font-weight="700">GitOps</tspan> • 
      <tspan fill="#F472B6" font-weight="700">MLOps</tspan>
    </text>
  </g>

  <!-- Interactive Feature Badges inside Banner -->
  <g transform="translate(250, 205)">
    <!-- Badge 1: 3+ Years Exp -->
    <g transform="translate(0, 0)">
      <rect width="145" height="34" rx="8" fill="#0f172a" stroke="#0078D4" stroke-width="1.5" />
      <text x="14" y="22" fill="#38BDF8" font-size="13" font-weight="700" class="sans-text">💼 3+ Years Exp</text>
    </g>

    <!-- Badge 2: Enterprise Landing Zones -->
    <g transform="translate(155, 0)">
      <rect width="215" height="34" rx="8" fill="#0f172a" stroke="#0078D4" stroke-width="1.5" />
      <text x="14" y="22" fill="#E2E8F0" font-size="13" font-weight="600" class="sans-text">🏛️ Hub &amp; Spoke / CAF</text>
    </g>

    <!-- Badge 3: Azure DevOps Pipelines -->
    <g transform="translate(380, 0)">
      <rect width="215" height="34" rx="8" fill="#0f172a" stroke="#0078D4" stroke-width="1.5" />
      <text x="14" y="22" fill="#E2E8F0" font-size="13" font-weight="600" class="sans-text">⚡ Azure DevOps Orgs</text>
    </g>

    <!-- Badge 4: B.Tech CSE -->
    <g transform="translate(605, 0)">
      <rect width="180" height="34" rx="8" fill="#0f172a" stroke="#7928CA" stroke-width="1.5" />
      <text x="14" y="22" fill="#C084FC" font-size="13" font-weight="700" class="sans-text">🎓 B.Tech | 7.94 CGPA</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar (Gurgaon removed as requested) -->
  <g transform="translate(250, 265)">
    <text x="0" y="0" fill="#64748B" font-size="13" class="mono-text">
      <tspan fill="#34D399">● status:</tspan> Available for High-Impact DevOps &amp; Cloud Opportunities (Open to Relocation &amp; Remote)
    </text>
  </g>
</svg>
